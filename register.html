<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Register - CareerBridge</title><link rel="stylesheet" href="css/style.css"></head><body class="auth-page"><div class="auth-wrap"><a class="logo" href="index.html">Career<span>Bridge</span></a><div class="auth-card"><h1>Create your account</h1><p>Join CareerBridge and discover new opportunities.</p><form id="registerForm"><label>Full Name<input id="regName" required placeholder="Your name"></label><label>Email<input id="regEmail" type="email" required placeholder="you@example.com"></label><label>Password<input id="regPassword" type="password" minlength="6" required placeholder="Minimum 6 characters"></label><label>Account Type<select id="regRole"><option>Student</option><option>Recruiter</option></select></label><button class="btn btn-primary full">Create Account</button></form><p class="form-note">Already have an account? <a href="login.html">Login</a></p><div id="registerMessage" class="message"></div></div></div><script src="js/app.js"></script><script src="js/auth.js"></script></body></html>
