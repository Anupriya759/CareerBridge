<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Jobs - CareerBridge</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<header class="navbar"><a class="logo" href="index.html">Career<span>Bridge</span></a><nav><a href="index.html">Home</a><a href="jobs.html" class="active">Jobs</a><a href="companies.html">Companies</a><a href="about.html">About</a></nav><div class="nav-actions"><a class="btn btn-outline" href="login.html">Login</a><a class="btn btn-primary" href="register.html">Register</a></div></header>
<main class="page">
<section class="page-header"><span class="eyebrow">OPPORTUNITIES</span><h1>Find your next job</h1><p>Search and filter jobs based on your skills and preferences.</p></section>
<section class="job-search"><input id="jobSearch" placeholder="Search job title or skill"><select id="jobLocation"><option value="">All locations</option><option>Chennai</option><option>Bangalore</option><option>Hyderabad</option><option>Remote</option><option>Madurai</option></select><select id="jobType"><option value="">All types</option><option>Fresher</option><option>Internship</option><option>Full Time</option></select><button class="btn btn-primary" onclick="renderJobs()">Search</button></section>
<div class="content-layout"><aside class="filter-card"><h3>Filters</h3><label>Experience</label><label class="check"><input type="checkbox" value="Fresher" class="expFilter"> Fresher</label><label class="check"><input type="checkbox" value="1-2 years" class="expFilter"> 1–2 years</label><label>Work mode</label><label class="check"><input type="checkbox" value="Remote" class="modeFilter"> Remote</label><label class="check"><input type="checkbox" value="On-site" class="modeFilter"> On-site</label><button class="btn btn-outline full" onclick="clearFilters()">Clear filters</button></aside><section><div class="results-row"><strong id="resultCount"></strong><select id="sortJobs" onchange="renderJobs()"><option value="latest">Latest</option><option value="salary">Salary: High to Low</option></select></div><div id="jobList" class="job-list"></div></section></div>
</main><footer><div class="footer-inner"><strong>CareerBridge</strong><span>© 2026 CareerBridge</span><div><a href="about.html">About</a><a href="contact.html">Contact</a></div></div></footer><script src="js/app.js"></script><script src="js/jobs.js"></script></body></html>
